name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Every push to main deploys to staging, which must then serve the app and the API and pass the
  # end-to-end check with the real models, Workflows and Browser Run.
  deploy-staging:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_SIGNIN_KEY: ${{ secrets.TEST_SIGNIN_KEY }}
    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Staging deploy skipped: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the staging environment (see the README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v6
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - if: steps.config.outputs.ready == 'true'
        run: npm ci
      - if: steps.config.outputs.ready == 'true'
        run: npm run build:staging
      - name: Deploy
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - name: Smoke test
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url" || { echo "no workers.dev URL in deploy output"; exit 1; }
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$url/api/health"
          curl --fail --silent --show-error --output /dev/null "$url/"
          echo "STAGING_URL=$url" >> "$GITHUB_ENV"
      - name: End-to-end check
        if: steps.config.outputs.ready == 'true' && env.TEST_SIGNIN_KEY != ''
        run: npm run e2e:staging
