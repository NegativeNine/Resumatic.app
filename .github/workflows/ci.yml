name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/*.test.mjs
      - run: npm run build

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high --json > dependency-audit.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error

  deploy-staging:
    needs: [test, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true' && vars.STAGING_SMOKE_ONLY != 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_SIGNIN_KEY: ${{ secrets.TEST_SIGNIN_KEY }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      EVAL_BUDGET_USD: ${{ vars.EVAL_BUDGET_USD }}
      EVAL_MAX_CALLS: ${{ vars.EVAL_MAX_CALLS }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate-config.mjs --environment staging --purpose deploy --report staging-preflight.json
      - name: Reject secrets that shadow evaluated staging configuration
        run: node scripts/check-evaluation-secrets.mjs
      - run: npm run build:staging
      - run: npx wrangler deploy
      - name: Require shared accounting for paid CI work
        run: node scripts/ci-paid-budget-guard.mjs
      - name: Deployed lifecycle
        run: npm run e2e:staging
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: staging-evidence
          path: |
            staging-preflight.json
            e2e-report.json
            deletion-manifest.json
          if-no-files-found: error

  # A model-free staging deploy: test sign-in and synthetic data only, with every model call and
  # uncached PDF failing closed (PILOT_SHARED_BUDGET). It shows that the build deploys and serves.
  # It isn't a live check, an end-to-end run or a release gate.
  deploy-staging-smoke:
    needs: [test, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true' && vars.STAGING_SMOKE_ONLY == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate-config.mjs --environment staging --purpose deploy --smoke-only --report staging-preflight.json
      - name: Reject secrets that shadow the staging configuration
        run: node scripts/check-staging-secrets.mjs
      - run: npm run build:staging
      - run: npx wrangler deploy
      - name: Smoke test the staging origin
        run: |
          node --input-type=module -e 'import {httpsOrigin} from "./scripts/lib/config.mjs"; const origin=httpsOrigin(process.env.STAGING_URL); if(!origin) process.exit(1); for (let attempt=0; attempt<6; attempt++) { try { const r=await fetch(`${origin}/api/health`,{redirect:"error",signal:AbortSignal.timeout(15000)}); if(r.ok) process.exit(0); } catch {} await new Promise((done)=>setTimeout(done,10000)); } process.exit(1);'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: staging-smoke-evidence
          path: staging-preflight.json
          if-no-files-found: error
