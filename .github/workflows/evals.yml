name: Evals

on:
  pull_request:
    paths:
      - "src/ai/**"
      - "src/pipeline/**"
      - "src/grounding/**"
      - "test/evals/**"
      - "test/extract-evals/**"
      - "wrangler.jsonc"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    # Opt-in: skipped live work is never evidence of a passing release gate.
    if: vars.LIVE_EVALS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: paid-evals
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
      AI_GATEWAY_ID: resumatic-staging
      EVAL_BUDGET_USD: ${{ vars.EVAL_BUDGET_USD }}
      EVAL_MAX_CALLS: ${{ vars.EVAL_MAX_CALLS }}
      EVAL_MODEL_PRICES: ${{ vars.EVAL_MODEL_PRICES }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate-config.mjs --purpose eval --report eval-preflight.json
      - run: npm run evals
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-evaluation-evidence
          path: |
            eval-preflight.json
            eval-report.json
          if-no-files-found: error
