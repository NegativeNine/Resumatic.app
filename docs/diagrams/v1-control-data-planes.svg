<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" role="img" aria-label="Everyday requests never reach the Directory" font-size="13" font-family="'Schibsted Grotesk', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7d8494"></path></marker><marker id="arch-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2c4bd6"></path></marker></defs><rect x="0" y="0" width="760" height="432" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#1b2238">Everyday requests never reach the Directory</text><text x="24" y="54" font-size="11.5" fill="#575e70">Sign-in, deletion and admin listing go through it; all else goes straight to that user’s vault</text><g><rect x="376" y="80" width="360" height="120" rx="8" fill="#f5f6f8"></rect><text x="392" y="101" font-weight="600" fill="#1b2238">Control plane</text></g><g><rect x="376" y="232" width="360" height="176" rx="8" fill="#f5f6f8"></rect><text x="392" y="253" font-weight="600" fill="#1b2238">Data plane · one Vault per user</text></g><g fill="none"><path d="M148 240H180" stroke="#7d8494" stroke-width="1.25" marker-end="url(#arch-arrow)"></path><path d="M250 204V148H392" stroke="#7d8494" stroke-width="1.25" marker-end="url(#arch-arrow)"></path><path d="M671 184V264" stroke="#7d8494" stroke-width="1.25" marker-end="url(#arch-arrow)"></path><path d="M214 276V292H392" stroke="#2c4bd6" stroke-width="2" marker-end="url(#arch-arrow-accent)"></path></g><g><rect x="24" y="212" width="124" height="56" rx="8" fill="none" stroke="#7d8494" stroke-width="1.25"></rect><text x="86" y="236" text-anchor="middle" font-weight="600" fill="#1b2238">Browser</text><text x="86" y="252" text-anchor="middle" font-size="11.5" fill="#575e70">holds the cookie</text></g><g><rect x="180" y="204" width="140" height="72" rx="8" fill="none" stroke="#7d8494" stroke-width="1.25"></rect><text x="250" y="228" text-anchor="middle" font-weight="600" fill="#1b2238">Worker</text><text x="250" y="244" text-anchor="middle" font-size="11.5" fill="#575e70">app and API</text><text x="250" y="260" text-anchor="middle" font-size="11.5" fill="#575e70">checks the cookie</text></g><g><rect x="392" y="112" width="328" height="72" rx="8" fill="none" stroke="#7d8494" stroke-width="1.25"></rect><text x="556" y="136" text-anchor="middle" font-weight="600" fill="#1b2238">Directory · one object</text><text x="556" y="152" text-anchor="middle" font-size="11.5" fill="#575e70">reached by name, no lookup</text><text x="556" y="168" text-anchor="middle" font-size="11.5" fill="#575e70">users, identities, vault IDs</text></g><g><rect x="392" y="264" width="98" height="56" rx="8" fill="none" stroke="#7d8494" stroke-width="1.25"></rect><text x="441" y="288" text-anchor="middle" font-weight="600" fill="#1b2238">Vault A</text><text x="441" y="304" text-anchor="middle" font-size="11.5" fill="#575e70">near user A</text></g><g><rect x="507" y="264" width="98" height="56" rx="8" fill="none" stroke="#7d8494" stroke-width="1.25"></rect><text x="556" y="288" text-anchor="middle" font-weight="600" fill="#1b2238">Vault B</text><text x="556" y="304" text-anchor="middle" font-size="11.5" fill="#575e70">near user B</text></g><g><rect x="622" y="264" width="98" height="56" rx="8" fill="none" stroke="#7d8494" stroke-width="1.25"></rect><text x="671" y="288" text-anchor="middle" font-weight="600" fill="#1b2238">Vault C</text><text x="671" y="304" text-anchor="middle" font-size="11.5" fill="#575e70">near user C</text></g><g><rect x="392" y="336" width="328" height="56" rx="8" fill="none" stroke="#7d8494" stroke-width="1.25"></rect><text x="556" y="360" text-anchor="middle" font-weight="600" fill="#1b2238">Workflows and R2 files</text><text x="556" y="376" text-anchor="middle" font-size="11.5" fill="#575e70">each run and each file belongs to one vault</text></g><text x="258" y="122" font-size="11.5" fill="#575e70">sign-in, deletion,</text><text x="258" y="138" font-size="11.5" fill="#575e70">admin listing</text><text x="663" y="220" text-anchor="end" font-size="11.5" fill="#575e70">creates a vault near the user, calls init()</text><text x="222" y="312" font-size="11.5" font-weight="600" fill="#1b2238">every other request</text><text x="222" y="328" font-size="11.5" fill="#1b2238">skips the Directory</text></svg>
