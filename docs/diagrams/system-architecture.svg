<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="Career data goes edge to vault; D1 stays off the request path" font-size="13" font-family="'Schibsted Grotesk', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7d8494"></path></marker><marker id="arch-hot-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2c4bd6"></path></marker></defs><rect x="0" y="0" width="760" height="560" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1b2238">Career data goes edge to vault; D1 stays off the request path</text><text x="24" y="48" font-size="11.5" fill="#575e70">Accent line: hot path, no control-plane lookup · dashed line: asynchronous outbox events</text><g><rect x="24" y="168" width="448" height="368" rx="8" fill="#f5f6f8"></rect><text x="40" y="190" font-weight="600" fill="#1b2238">Data plane · one vault per user</text></g><g><rect x="536" y="168" width="200" height="368" rx="8" fill="#f5f6f8"></rect><text x="552" y="190" font-weight="600" fill="#1b2238">Control plane</text></g><g fill="none" stroke="#7d8494" stroke-width="1.25"><path d="M236 100H300" marker-end="url(#arch-arrow)"></path><path d="M690 136V208" marker-end="url(#arch-arrow)"></path><path d="M552 232H456" marker-end="url(#arch-arrow)"></path><path d="M272 252H224" marker-end="url(#arch-arrow)"></path><path d="M364 296V328" marker-end="url(#arch-arrow)"></path><path d="M272 372H224" marker-end="url(#arch-arrow)"></path><path d="M364 416V448" marker-end="url(#arch-arrow)"></path><path d="M636 280V312" marker-end="url(#arch-arrow)"></path><path d="M636 432V400" marker-end="url(#arch-arrow)"></path><path d="M456 284H504V468H552" stroke-dasharray="4 4" marker-end="url(#arch-arrow)"></path></g><g><path d="M364 136V208" fill="none" stroke="#2c4bd6" stroke-width="2" marker-end="url(#arch-hot-arrow)"></path></g><g><rect x="24" y="72" width="212" height="56" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="36" y="96" font-weight="600" fill="#1b2238">Browser</text><text x="36" y="112" font-size="11.5" fill="#575e70">web app and resume editor</text></g><g><rect x="300" y="64" width="400" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="312" y="88" font-weight="600" fill="#1b2238">API Worker</text><text x="312" y="104" font-size="11.5" fill="#575e70">checks token, limits abuse, routes by vault name</text><text x="312" y="120" font-size="11.5" fill="#575e70">refreshes sessions from Workers KV, never D1</text></g><g><rect x="40" y="208" width="184" height="88" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="52" y="232" font-weight="600" fill="#1b2238">Tailor sessions</text><text x="52" y="248" font-size="11.5" fill="#575e70">one sub-agent per job</text><text x="52" y="264" font-size="11.5" fill="#575e70">chat, plans, drafts</text><text x="52" y="280" font-size="11.5" fill="#575e70">live progress to the UI</text></g><g><rect x="272" y="208" width="184" height="88" rx="8" fill="#2c4bd6" fill-opacity="0.12" stroke="#2c4bd6" stroke-width="2"></rect><text x="284" y="232" font-weight="600" fill="#1b2238">Career Vault</text><text x="284" y="248" font-size="11.5" fill="#1b2238">one per user, SQLite</text><text x="284" y="264" font-size="11.5" fill="#1b2238">sources, facts, quotes</text><text x="284" y="280" font-size="11.5" fill="#1b2238">vector and FTS5 search</text></g><g><rect x="40" y="328" width="184" height="88" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="52" y="352" font-weight="600" fill="#1b2238">R2, jurisdictional</text><text x="52" y="368" font-size="11.5" fill="#575e70">original uploads</text><text x="52" y="384" font-size="11.5" fill="#575e70">PDF and DOCX exports</text><text x="52" y="400" font-size="11.5" fill="#575e70">encrypted per user</text></g><g><rect x="272" y="328" width="184" height="88" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="284" y="352" font-weight="600" fill="#1b2238">Workflows</text><text x="284" y="368" font-size="11.5" fill="#575e70">Distill and Tailor runs</text><text x="284" y="384" font-size="11.5" fill="#575e70">steps persist and retry</text><text x="284" y="400" font-size="11.5" fill="#575e70">wait for user approval</text></g><g><rect x="40" y="448" width="416" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="52" y="472" font-weight="600" fill="#1b2238">AI services via AI Gateway</text><text x="52" y="488" font-size="11.5" fill="#575e70">Workers AI: toMarkdown, bge-m3 embeddings, reranker</text><text x="52" y="504" font-size="11.5" fill="#575e70">third-party LLMs write and judge; Browser Run renders PDFs</text></g><g><rect x="552" y="208" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="564" y="232" font-weight="600" fill="#1b2238">Control-plane API</text><text x="564" y="248" font-size="11.5" fill="#575e70">signup, billing, admin</text><text x="564" y="264" font-size="11.5" fill="#575e70">fleet operations</text></g><g><rect x="552" y="312" width="168" height="88" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="564" y="336" font-weight="600" fill="#1b2238">D1</text><text x="564" y="352" font-size="11.5" fill="#575e70">accounts, plans, usage</text><text x="564" y="368" font-size="11.5" fill="#575e70">vault directory</text><text x="564" y="384" font-size="11.5" fill="#575e70">prompt registry</text></g><g><rect x="552" y="432" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="564" y="456" font-weight="600" fill="#1b2238">Queue consumer</text><text x="564" y="472" font-size="11.5" fill="#575e70">applies outbox events</text><text x="564" y="488" font-size="11.5" fill="#575e70">to D1 in batches</text></g><g><text x="268" y="92" text-anchor="middle" font-size="11.5" fill="#575e70">requests</text><text x="372" y="158" font-size="11.5" font-weight="600" fill="#1b2238">hot path, no D1</text><text x="682" y="158" text-anchor="end" font-size="11.5" fill="#575e70">control path</text><text x="504" y="224" text-anchor="middle" font-size="11.5" fill="#575e70">RPC</text><text x="248" y="244" text-anchor="middle" font-size="11.5" fill="#575e70">spawns</text><text x="372" y="316" font-size="11.5" fill="#575e70">starts runs</text><text x="248" y="364" text-anchor="middle" font-size="11.5" fill="#575e70">files</text><text x="372" y="436" font-size="11.5" fill="#575e70">model calls</text><text x="644" y="300" font-size="11.5" fill="#575e70">SQL</text></g></svg>
