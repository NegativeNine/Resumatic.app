<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 612" role="img" aria-label="Six milestones, each closed by a test, from empty repo to private beta" font-size="13" font-family="'Schibsted Grotesk', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0" y="0" width="760" height="612" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#1b2238">Six milestones, each closed by a test, from empty repo to private beta</text><text x="24" y="54" font-size="11.5" fill="#575e70">Build order, top to bottom; a diamond marks the test that must pass before the next milestone starts</text><g stroke="#d9dce3" stroke-width="1.25"><line x1="48" x2="48" y1="126" y2="186"></line><line x1="48" x2="48" y1="214" y2="274"></line><line x1="48" x2="48" y1="302" y2="362"></line><line x1="48" x2="48" y1="390" y2="450"></line><line x1="48" x2="48" y1="478" y2="538"></line></g><g><g><line x1="62" x2="80" y1="112" y2="112" stroke="#7d8494" stroke-width="1.25"></line><circle cx="48" cy="112" r="14" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></circle><rect x="80" y="76" width="656" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><path d="M101 128l5 -5l5 5l-5 5z" fill="#7d8494"></path></g><text x="48" y="116" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b2238">M0</text><text x="96" y="100" font-weight="600" fill="#1b2238">Skeleton</text><text x="96" y="116" font-size="11.5" fill="#1b2238">Ships: React app and Worker on the Vite plugin, empty Directory and Vault classes, CI deploys</text><text x="116" y="132" font-size="11.5" fill="#575e70">Done when: every push deploys to staging, which serves the app and the API</text></g><g><g><line x1="62" x2="80" y1="200" y2="200" stroke="#7d8494" stroke-width="1.25"></line><circle cx="48" cy="200" r="14" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></circle><rect x="80" y="164" width="656" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><path d="M101 216l5 -5l5 5l-5 5z" fill="#7d8494"></path></g><text x="48" y="204" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b2238">M1</text><text x="96" y="188" font-weight="600" fill="#1b2238">Accounts and deletion</text><text x="96" y="204" font-size="11.5" fill="#1b2238">Ships: Google sign-in, vault creation with location hints, the signed cookie, account deletion</text><text x="116" y="220" font-size="11.5" fill="#575e70">Done when: a second sign-in reuses the same vault, and deletion leaves no rows, objects or files</text></g><g><g><line x1="62" x2="80" y1="288" y2="288" stroke="#7d8494" stroke-width="1.25"></line><circle cx="48" cy="288" r="14" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></circle><rect x="80" y="252" width="656" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><path d="M101 304l5 -5l5 5l-5 5z" fill="#7d8494"></path></g><text x="48" y="292" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b2238">M2</text><text x="96" y="276" font-weight="600" fill="#1b2238">Vault and Distill</text><text x="96" y="292" font-size="11.5" fill="#1b2238">Ships: upload, the Distill Workflow, fact review, adding and editing facts</text><text x="116" y="308" font-size="11.5" fill="#575e70">Done when: every proposed fact shows a quote found verbatim in its source</text></g><g><g><line x1="62" x2="80" y1="376" y2="376" stroke="#2c4bd6" stroke-width="2"></line><circle cx="48" cy="376" r="14" fill="#2c4bd6" fill-opacity="0.12" stroke="#2c4bd6" stroke-width="2"></circle><rect x="80" y="340" width="656" height="72" rx="8" fill="#2c4bd6" fill-opacity="0.12" stroke="#2c4bd6" stroke-width="2"></rect><path d="M101 392l5 -5l5 5l-5 5z" fill="#2c4bd6"></path></g><text x="48" y="380" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b2238">M3</text><text x="96" y="364" font-weight="600" fill="#1b2238">Tailoring</text><text x="96" y="380" font-size="11.5" fill="#1b2238">Ships: job description input, the Tailor Workflow, a resume view that shows each line’s facts</text><text x="116" y="396" font-size="11.5" fill="#1b2238">Done when: the eval suite lets no planted fabrication through</text></g><g><g><line x1="62" x2="80" y1="464" y2="464" stroke="#7d8494" stroke-width="1.25"></line><circle cx="48" cy="464" r="14" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></circle><rect x="80" y="428" width="656" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><path d="M101 480l5 -5l5 5l-5 5z" fill="#7d8494"></path></g><text x="48" y="468" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b2238">M4</text><text x="96" y="452" font-weight="600" fill="#1b2238">Export</text><text x="96" y="468" font-size="11.5" fill="#1b2238">Ships: PDF download through Browser Run, JSON export of the whole vault</text><text x="116" y="484" font-size="11.5" fill="#575e70">Done when: the PDF matches the resume view, and the export holds every row</text></g><g><g><line x1="62" x2="80" y1="552" y2="552" stroke="#7d8494" stroke-width="1.25"></line><circle cx="48" cy="552" r="14" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></circle><rect x="80" y="516" width="656" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><path d="M101 568l5 -5l5 5l-5 5z" fill="#7d8494"></path></g><text x="48" y="556" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b2238">M5</text><text x="96" y="540" font-weight="600" fill="#1b2238">Private beta</text><text x="96" y="556" font-size="11.5" fill="#1b2238">Ships: the monthly quota, admin listing behind Access, the staging deletion test</text><text x="116" y="572" font-size="11.5" fill="#575e70">Done when: the first outside users download tailored resumes</text></g></svg>
