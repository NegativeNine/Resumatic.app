<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" role="img" aria-label="Accepted introductions fund the free tier that grows what recruiters buy" font-size="13" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="fly-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8c87"></path></marker><marker id="fly-accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c96442"></path></marker></defs><rect x="0" y="0" width="760" height="496" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Accepted introductions fund the free tier that grows what recruiters buy</text><text x="24" y="48" font-size="11.5" fill="#6b6966">Inflows on the left and below · accent: the link that makes the loop reinforce itself</text><g fill="none" stroke="#8f8c87" stroke-width="1.25"><path d="M468 132H498" marker-end="url(#fly-arrow)"></path><path d="M618 168V294" marker-end="url(#fly-arrow)"></path><path d="M500 332H470" marker-end="url(#fly-arrow)"></path><path d="M192 108H230" marker-end="url(#fly-arrow)"></path><path d="M192 196H260V170" marker-end="url(#fly-arrow)"></path><path d="M618 400V370" marker-end="url(#fly-arrow)"></path></g><g><path d="M350 296V170" fill="none" stroke="#c96442" stroke-width="2" marker-end="url(#fly-accent-arrow)"></path><text x="362" y="214" font-weight="600" fill="#1f1e1d">Reinforcing link</text><text x="362" y="232" font-size="11.5" fill="#1f1e1d">accepted intros fund the free tier</text><text x="362" y="248" font-size="11.5" fill="#1f1e1d">and reward seekers for keeping</text><text x="362" y="264" font-size="11.5" fill="#1f1e1d">facts current and attested</text></g><g><rect x="232" y="96" width="236" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25"></rect><text x="244" y="120" font-weight="600" fill="#1f1e1d">Seekers build vaults</text><text x="244" y="136" font-size="11.5" fill="#6b6966">free tailoring for every user</text><text x="244" y="152" font-size="11.5" fill="#6b6966">every fact quoted and checked</text></g><g><rect x="500" y="96" width="236" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25"></rect><text x="512" y="120" font-weight="600" fill="#1f1e1d">Evidence-backed cards</text><text x="512" y="136" font-size="11.5" fill="#6b6966">opt-in and pseudonymous</text><text x="512" y="152" font-size="11.5" fill="#6b6966">each skill shows how it is known</text></g><g><rect x="500" y="296" width="236" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25"></rect><text x="512" y="320" font-weight="600" fill="#1f1e1d">Recruiters request intros</text><text x="512" y="336" font-size="11.5" fill="#6b6966">verified orgs, pay range required</text><text x="512" y="352" font-size="11.5" fill="#6b6966">a credit is held, not spent</text></g><g><rect x="232" y="296" width="236" height="72" rx="8" fill="#c96442" fill-opacity="0.12" stroke="#c96442" stroke-width="2"></rect><text x="244" y="320" font-weight="600" fill="#1f1e1d">Candidates accept</text><text x="244" y="336" font-size="11.5" fill="#1f1e1d">only the intros they want</text><text x="244" y="352" font-size="11.5" fill="#1f1e1d">the credit is charged on yes</text></g><g><rect x="24" y="72" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25"></rect><text x="36" y="96" font-weight="600" fill="#1f1e1d">Partner cohorts</text><text x="36" y="112" font-size="11.5" fill="#6b6966">outplacement, schools</text><text x="36" y="128" font-size="11.5" fill="#6b6966">and communities</text></g><g><rect x="24" y="160" width="168" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25"></rect><text x="36" y="184" font-weight="600" fill="#1f1e1d">Attesters</text><text x="36" y="200" font-size="11.5" fill="#6b6966">colleagues who confirm</text><text x="36" y="216" font-size="11.5" fill="#6b6966">a fact see the product</text></g><g><rect x="500" y="400" width="236" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25"></rect><text x="512" y="424" font-weight="600" fill="#1f1e1d">Demand partners</text><text x="512" y="440" font-size="11.5" fill="#6b6966">ATS connectors and job boards</text><text x="512" y="456" font-size="11.5" fill="#6b6966">bring openings and applicants</text></g><text x="630" y="236" font-size="11.5" fill="#6b6966">recruiters search</text></svg>
