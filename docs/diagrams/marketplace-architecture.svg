<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 528" role="img" aria-label="Recruiters reach candidates only through index shards and intro threads" font-size="13" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="mkt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8c87"></path></marker><marker id="mkt-accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c96442"></path></marker></defs><rect x="0" y="0" width="760" height="528" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Recruiters reach candidates only through index shards and intro threads</text><text x="24" y="48" font-size="11.5" fill="#6b6966">Accent: the only crossings to the recruiter side · dashed: metadata events only</text><g><rect x="24" y="72" width="368" height="288" rx="8" fill="#f5f3ef"></rect><text x="40" y="96" font-weight="600" fill="#1f1e1d">Candidate&#x27;s jurisdiction</text></g><g><rect x="424" y="72" width="312" height="288" rx="8" fill="#f5f3ef"></rect><text x="440" y="96" font-weight="600" fill="#1f1e1d">Organization&#x27;s jurisdiction</text></g><g><rect x="24" y="392" width="712" height="112" rx="8" fill="#f5f3ef"></rect><text x="40" y="416" font-weight="600" fill="#1f1e1d">Control plane</text></g><g fill="none" stroke="#8f8c87" stroke-width="1.25"><path d="M198 164H218" marker-start="url(#mkt-arrow)" marker-end="url(#mkt-arrow)"></path><path d="M118 202V270" marker-start="url(#mkt-arrow)" marker-end="url(#mkt-arrow)"></path><path d="M580 272V202" marker-end="url(#mkt-arrow)"></path><path d="M296 460H326" marker-end="url(#mkt-arrow)"></path></g><g fill="none" stroke="#8f8c87" stroke-width="1.25" stroke-dasharray="4 4"><path d="M208 344V430" marker-end="url(#mkt-arrow)"></path><path d="M580 344V376H284V430" marker-end="url(#mkt-arrow)"></path></g><g fill="none" stroke="#c96442" stroke-width="2"><path d="M378 164H438" marker-start="url(#mkt-accent-arrow)" marker-end="url(#mkt-accent-arrow)"></path><path d="M378 308H438" marker-start="url(#mkt-accent-arrow)" marker-end="url(#mkt-accent-arrow)"></path></g><g><rect x="40" y="128" width="156" height="72" rx="8" fill="none" stroke="#8f8c87" stroke-width="1.25"></rect><text x="52" y="152" font-weight="600" fill="#1f1e1d">Career Vault</text><text x="52" y="168" font-size="11.5" fill="#6b6966">builds its own card</text><text x="52" y="184" font-size="11.5" fill="#6b6966">answers match reports</text></g><g><rect x="220" y="128" width="156" height="72" rx="8" fill="none" stroke="#8f8c87" stroke-width="1.25"></rect><text x="232" y="152" font-weight="600" fill="#1f1e1d">Index shards</text><text x="232" y="168" font-size="11.5" fill="#6b6966">pseudonymous cards</text><text x="232" y="184" font-size="11.5" fill="#6b6966">keep vault references</text></g><g><rect x="440" y="128" width="280" height="72" rx="8" fill="none" stroke="#8f8c87" stroke-width="1.25"></rect><text x="452" y="152" font-weight="600" fill="#1f1e1d">Req sessions</text><text x="452" y="168" font-size="11.5" fill="#6b6966">one sub-agent per opening</text><text x="452" y="184" font-size="11.5" fill="#6b6966">never learn vault names</text></g><g><rect x="40" y="272" width="336" height="72" rx="8" fill="none" stroke="#8f8c87" stroke-width="1.25"></rect><text x="52" y="296" font-weight="600" fill="#1f1e1d">Intro threads, one per introduction</text><text x="52" y="312" font-size="11.5" fill="#6b6966">request, decision, approved snapshot</text><text x="52" y="328" font-size="11.5" fill="#6b6966">relay messages and outcomes</text></g><g><rect x="440" y="272" width="280" height="72" rx="8" fill="none" stroke="#8f8c87" stroke-width="1.25"></rect><text x="452" y="296" font-weight="600" fill="#1f1e1d">Recruiter workspace, one per org</text><text x="452" y="312" font-size="11.5" fill="#6b6966">seats, openings, pipeline, notes</text><text x="452" y="328" font-size="11.5" fill="#6b6966">credit balance and outbox</text></g><g><rect x="40" y="432" width="256" height="56" rx="8" fill="none" stroke="#8f8c87" stroke-width="1.25"></rect><text x="52" y="456" font-weight="600" fill="#1f1e1d">Queue consumer</text><text x="52" y="472" font-size="11.5" fill="#6b6966">applies metadata events</text></g><g><rect x="328" y="432" width="392" height="56" rx="8" fill="none" stroke="#8f8c87" stroke-width="1.25"></rect><text x="340" y="456" font-weight="600" fill="#1f1e1d">D1</text><text x="340" y="472" font-size="11.5" fill="#6b6966">workspace directory, credit ledger, shard map</text></g><g><text x="208" y="120" text-anchor="middle" font-size="11.5" fill="#6b6966">cards, and report requests back</text><text x="408" y="120" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">search; cards and reports</text><text x="130" y="240" font-size="11.5" fill="#6b6966">delivers, decides, shares</text><text x="592" y="240" font-size="11.5" fill="#6b6966">spawns</text><text x="408" y="264" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">requests; approved snapshot</text><text x="592" y="372" font-size="11.5" fill="#6b6966">IDs and counts only</text></g></svg>
