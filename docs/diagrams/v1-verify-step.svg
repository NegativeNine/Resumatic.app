<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" role="img" aria-label="Every shipped line passed the checks or is the user’s own fact" font-size="13" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="verify-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8c87"></path></marker></defs><rect x="0" y="0" width="760" height="372" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">Every shipped line passed the checks or is the user’s own fact</text><text x="24" y="54" font-size="11.5" fill="#6b6966">Checks: citations, numbers, names and scope, then a judge from another model family</text><g fill="none" stroke="#8f8c87" stroke-width="1.25"><path d="M200 112H292" marker-end="url(#verify-arrow)"></path><path d="M468 112H560" marker-end="url(#verify-arrow)"></path><path d="M380 140V164H112V188" marker-end="url(#verify-arrow)"></path><path d="M200 216H292" marker-end="url(#verify-arrow)"></path><path d="M468 216H560" marker-end="url(#verify-arrow)"></path><path d="M380 244V268H112V292" marker-end="url(#verify-arrow)"></path><path d="M200 320H560" marker-end="url(#verify-arrow)"></path></g><g><rect x="24" y="84" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25"></rect><text x="112" y="108" text-anchor="middle" font-weight="600" fill="#1f1e1d">Writer’s line</text><text x="112" y="124" text-anchor="middle" font-size="11.5" fill="#6b6966">cites fact IDs</text></g><g><rect x="292" y="84" width="176" height="56" rx="8" fill="#c96442" fill-opacity="0.12" stroke="#c96442" stroke-width="2"></rect><text x="380" y="108" text-anchor="middle" font-weight="600" fill="#1f1e1d">Checks, then judge</text><text x="380" y="124" text-anchor="middle" font-size="11.5" fill="#1f1e1d">every one must pass</text></g><g><rect x="560" y="84" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25"></rect><text x="648" y="108" text-anchor="middle" font-weight="600" fill="#1f1e1d">Ships as written</text><text x="648" y="124" text-anchor="middle" font-size="11.5" fill="#6b6966">counted as kept</text></g><g><rect x="24" y="188" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25"></rect><text x="112" y="212" text-anchor="middle" font-weight="600" fill="#1f1e1d">Repair once</text><text x="112" y="228" text-anchor="middle" font-size="11.5" fill="#6b6966">rewrite with the reason</text></g><g><rect x="292" y="188" width="176" height="56" rx="8" fill="#c96442" fill-opacity="0.12" stroke="#c96442" stroke-width="2"></rect><text x="380" y="212" text-anchor="middle" font-weight="600" fill="#1f1e1d">Checks, then judge</text><text x="380" y="228" text-anchor="middle" font-size="11.5" fill="#1f1e1d">the same checks again</text></g><g><rect x="560" y="188" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25"></rect><text x="648" y="212" text-anchor="middle" font-weight="600" fill="#1f1e1d">Ships as repaired</text><text x="648" y="228" text-anchor="middle" font-size="11.5" fill="#6b6966">counted as repaired</text></g><g><rect x="24" y="292" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25"></rect><text x="112" y="316" text-anchor="middle" font-weight="600" fill="#1f1e1d">Cited fact’s text</text><text x="112" y="332" text-anchor="middle" font-size="11.5" fill="#6b6966">its first selected fact</text></g><g><rect x="560" y="292" width="176" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25"></rect><text x="648" y="316" text-anchor="middle" font-weight="600" fill="#1f1e1d">Ships as replaced</text><text x="648" y="332" text-anchor="middle" font-size="11.5" fill="#6b6966">counted as replaced</text></g><text x="514" y="104" text-anchor="middle" font-size="11.5" fill="#6b6966">pass</text><text x="388" y="158" font-size="11.5" fill="#6b6966">fail</text><text x="514" y="208" text-anchor="middle" font-size="11.5" fill="#6b6966">pass</text><text x="388" y="262" font-size="11.5" fill="#6b6966">fails again</text><text x="380" y="312" text-anchor="middle" font-size="11.5" fill="#6b6966">already confirmed, so no checks</text></svg>
