<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" role="img" aria-label="Code makes every decision that affects truth" font-size="13" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="pipe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8c87"></path></marker></defs><rect x="0" y="0" width="760" height="388" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1d">Code makes every decision that affects truth</text><text x="24" y="48" font-size="11.5" fill="#6b6966">Accent: decided by code · plain: model-assisted · dashed: optional user step</text><g fill="none" stroke="#8f8c87" stroke-width="1.25"><path d="M144 132H172" marker-end="url(#pipe-arrow)"></path><path d="M292 132H320" marker-end="url(#pipe-arrow)"></path><path d="M440 132H468" marker-end="url(#pipe-arrow)"></path><path d="M588 132H616" marker-end="url(#pipe-arrow)"></path><path d="M676 96V76H528V96" marker-end="url(#pipe-arrow)"></path><path d="M676 168V200H84V232" marker-end="url(#pipe-arrow)"></path><path d="M144 268H172" marker-end="url(#pipe-arrow)"></path><path d="M292 268H320" marker-end="url(#pipe-arrow)"></path><path d="M440 268H468" marker-end="url(#pipe-arrow)"></path><path d="M232 304V328H84V304" marker-end="url(#pipe-arrow)"></path></g><g><rect x="24" y="96" width="120" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25" stroke-dasharray="none"></rect><text x="36" y="120" font-weight="600" fill="#1f1e1d">Analyze JD</text><text x="36" y="136" font-size="11.5" fill="#6b6966">typed, weighted</text><text x="36" y="152" font-size="11.5" fill="#6b6966">requirements</text></g><g><rect x="172" y="96" width="120" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25" stroke-dasharray="none"></rect><text x="184" y="120" font-weight="600" fill="#1f1e1d">Retrieve</text><text x="184" y="136" font-size="11.5" fill="#6b6966">FTS5 + vectors,</text><text x="184" y="152" font-size="11.5" fill="#6b6966">then rerank</text></g><g><rect x="320" y="96" width="120" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25" stroke-dasharray="none"></rect><text x="332" y="120" font-weight="600" fill="#1f1e1d">Grade</text><text x="332" y="136" font-size="11.5" fill="#6b6966">scores 0 to 3,</text><text x="332" y="152" font-size="11.5" fill="#6b6966">cites fact IDs</text></g><g><rect x="468" y="96" width="120" height="72" rx="8" fill="#c96442" fill-opacity="0.12" stroke="#c96442" stroke-width="2" stroke-dasharray="none"></rect><text x="480" y="120" font-weight="600" fill="#1f1e1d">Select</text><text x="480" y="136" font-size="11.5" fill="#1f1e1d">greedy within</text><text x="480" y="152" font-size="11.5" fill="#1f1e1d">page budget</text></g><g><rect x="616" y="96" width="120" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="628" y="120" font-weight="600" fill="#1f1e1d">Review</text><text x="628" y="136" font-size="11.5" fill="#6b6966">optional; user</text><text x="628" y="152" font-size="11.5" fill="#6b6966">approves plan</text></g><g><rect x="24" y="232" width="120" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8f8c87" stroke-width="1.25" stroke-dasharray="none"></rect><text x="36" y="256" font-weight="600" fill="#1f1e1d">Write</text><text x="36" y="272" font-size="11.5" fill="#6b6966">JD vocabulary,</text><text x="36" y="288" font-size="11.5" fill="#6b6966">cites its facts</text></g><g><rect x="172" y="232" width="120" height="72" rx="8" fill="#c96442" fill-opacity="0.12" stroke="#c96442" stroke-width="2" stroke-dasharray="none"></rect><text x="184" y="256" font-weight="600" fill="#1f1e1d">Verify</text><text x="184" y="272" font-size="11.5" fill="#1f1e1d">rules, then a</text><text x="184" y="288" font-size="11.5" fill="#1f1e1d">judge model</text></g><g><rect x="320" y="232" width="120" height="72" rx="8" fill="#c96442" fill-opacity="0.12" stroke="#c96442" stroke-width="2" stroke-dasharray="none"></rect><text x="332" y="256" font-weight="600" fill="#1f1e1d">Fit to page</text><text x="332" y="272" font-size="11.5" fill="#1f1e1d">measures pages,</text><text x="332" y="288" font-size="11.5" fill="#1f1e1d">trims by gain</text></g><g><rect x="468" y="232" width="120" height="72" rx="8" fill="#c96442" fill-opacity="0.12" stroke="#c96442" stroke-width="2" stroke-dasharray="none"></rect><text x="480" y="256" font-weight="600" fill="#1f1e1d">Render, store</text><text x="480" y="272" font-size="11.5" fill="#1f1e1d">PDF and DOCX,</text><text x="480" y="288" font-size="11.5" fill="#1f1e1d">with citations</text></g><g><text x="602" y="68" text-anchor="middle" font-size="11.5" fill="#6b6966">answers become facts; selection reruns</text><text x="668" y="188" text-anchor="end" font-size="11.5" fill="#6b6966">approved, or express mode</text><text x="158" y="348" text-anchor="middle" font-size="11.5" fill="#6b6966">fails a check: repair, max twice</text><text x="158" y="364" text-anchor="middle" font-size="11.5" fill="#6b6966">then show the quote, or drop it</text></g></svg>
