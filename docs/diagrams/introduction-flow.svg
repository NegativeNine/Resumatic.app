<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img" aria-label="A recruiter pays only when the candidate says yes" font-size="13" font-family="'Schibsted Grotesk', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="intro-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7d8494"></path></marker><marker id="intro-accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2c4bd6"></path></marker></defs><rect x="0" y="0" width="760" height="292" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1b2238">A recruiter pays only when the candidate says yes</text><text x="24" y="48" font-size="11.5" fill="#575e70">Accent: the only path that shares anything beyond the card</text><g fill="none" stroke="#7d8494" stroke-width="1.25"><path d="M184 124H206" marker-end="url(#intro-arrow)"></path><path d="M408 124H426" marker-end="url(#intro-arrow)"></path><path d="M476 164V194" marker-end="url(#intro-arrow)"></path><path d="M240 196V170" marker-end="url(#intro-arrow)"></path></g><g fill="none" stroke="#2c4bd6" stroke-width="2"><path d="M524 124H542" marker-end="url(#intro-accent-arrow)"></path><path d="M640 160V194" marker-end="url(#intro-accent-arrow)"></path></g><g><rect x="24" y="88" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="36" y="112" font-weight="600" fill="#1b2238">Recruiter requests</text><text x="36" y="128" font-size="11.5" fill="#575e70">opening and pay range</text><text x="36" y="144" font-size="11.5" fill="#575e70">one credit is held</text></g><g><rect x="208" y="80" width="200" height="88" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="220" y="104" font-weight="600" fill="#1b2238">Candidate reviews</text><text x="220" y="120" font-size="11.5" fill="#575e70">verified org and pay range</text><text x="220" y="136" font-size="11.5" fill="#575e70">fit preview from their vault</text><text x="220" y="152" font-size="11.5" fill="#575e70">optional tailored draft</text></g><g><polygon points="476,84 524,124 476,164 428,124" fill="none" stroke="#7d8494" stroke-width="1.25"></polygon><text x="476" y="128" text-anchor="middle" fill="#1b2238">Accept?</text></g><g><rect x="544" y="88" width="192" height="72" rx="8" fill="#2c4bd6" fill-opacity="0.12" stroke="#2c4bd6" stroke-width="2"></rect><text x="556" y="112" font-weight="600" fill="#1b2238">Credit charged</text><text x="556" y="128" font-size="11.5" fill="#1b2238">chosen resume and facts</text><text x="556" y="144" font-size="11.5" fill="#1b2238">shared in the thread</text></g><g><rect x="24" y="196" width="248" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="36" y="220" font-weight="600" fill="#1b2238">Or the candidate starts</text><text x="36" y="236" font-size="11.5" fill="#575e70">a raised hand or an application</text><text x="36" y="252" font-size="11.5" fill="#575e70">begins at the review step</text></g><g><rect x="296" y="196" width="232" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="308" y="220" font-weight="600" fill="#1b2238">Credit released</text><text x="308" y="236" font-size="11.5" fill="#575e70">the recruiter sees: not now</text><text x="308" y="252" font-size="11.5" fill="#575e70">no reason unless one is given</text></g><g><rect x="544" y="196" width="192" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7d8494" stroke-width="1.25"></rect><text x="556" y="220" font-weight="600" fill="#1b2238">Thread opens</text><text x="556" y="236" font-size="11.5" fill="#575e70">relay messages, ATS push</text><text x="556" y="252" font-size="11.5" fill="#575e70">outcomes from both sides</text></g><text x="533" y="106" text-anchor="middle" font-size="11.5" fill="#575e70">yes</text><text x="486" y="186" font-size="11.5" fill="#575e70">no, or 7 days</text></svg>
